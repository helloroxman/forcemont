<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FORCEMONT</title>
  <meta name="description" content="Force Without Limits. We believe the strongest ideas begin beyond the obvious.">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --muted: rgba(255, 255, 255, 0.62);
      --line: rgba(255, 255, 255, 0.14);
      --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding: 24px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 0;
    }

    .logo {
      font-weight: 700;
      font-size: clamp(2.6rem, 10vw, 6rem);
      letter-spacing: 0.08em;
      line-height: 1;
      color: var(--fg);
      text-decoration: none;
    }

    .tagline {
      margin-top: 28px;
      font-weight: 500;
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      letter-spacing: 0.04em;
    }

    .rule {
      width: 48px;
      height: 1px;
      background: var(--line);
      margin: 40px 0;
    }

    .manifesto {
      font-size: clamp(0.9rem, 2vw, 1rem);
      line-height: 1.8;
      color: var(--muted);
    }

    .manifesto p + p { margin-top: 0.2em; }

    @media (max-width: 600px) {
      body { padding: 20px 16px; }
      .rule { margin: 32px 0; }
    }
  </style>
</head>
<body>
  <main>
    <a class="logo" href="/">FORCEMONT</a>
    <p class="tagline">Force Without Limits.</p>

    <div class="rule" aria-hidden="true"></div>

    <div class="manifesto">
      <p>We believe the strongest ideas begin beyond the obvious.</p>
      <p>No fixed paths. No predefined limits.</p>
      <p>Only the freedom to choose the next mountain.</p>
    </div>
  </main>

</body>
</html>
